spring.application.name=incident-tracking
spring.ai.ollama.chat.model=qwen2.5:7b
spring.ai.ollama.chat.temperature=0.0
spring.ai.ollama.chat.num-ctx=8192
spring.threads.virtual.enabled=true

# guardrails for the whole team of agents, per incident
incident.token-budget=30000
incident.worker-timeout-seconds=90
incident.max-drafts=2

# tracking: trace every request, send spans to Zipkin (started from compose.yaml), expose metrics
management.tracing.sampling.probability=1.0
management.endpoints.web.exposure.include=health,metrics
