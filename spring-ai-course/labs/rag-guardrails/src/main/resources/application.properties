spring.application.name=rag-guardrails
spring.ai.ollama.chat.model=gemma3:4b
spring.ai.ollama.embedding.model=mxbai-embed-large
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=1024
spring.web.error.include-message=always

# guardrails (set to false to see what each one stops)
app.guard.scan=true
app.guard.prompt=true
app.guard.output=true

# cost control: tokens each user can spend (resets on restart in this demo)
app.budget.tokens-per-user=1000
