spring.application.name=inventory-agent
server.port=8081
spring.ai.ollama.chat.model=qwen2.5:7b
spring.ai.ollama.chat.temperature=0.0

# A2A SDK settings
# A local model can need more than the default 30 seconds
a2a.blocking.agent.timeout.seconds=120
# LOCAL LAB ONLY: the SDK refuses every task unless you add a TaskAuthorizationProvider
# (real authentication). Never turn this off on a server others can reach.
a2a.authorization.required=false
